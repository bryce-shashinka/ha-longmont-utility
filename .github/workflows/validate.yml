name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: ruff check custom_components tests
      - run: mypy
      - run: python -m pytest tests -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: rm -rf tests
      - uses: home-assistant/actions/hassfest@342664e951e2fd5f00bc990fc968342388252475

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@885037da508419fd08c13515967aec868dfdee2d
        with:
          category: integration
